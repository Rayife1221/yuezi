<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>廣東話生僻字 · 續篇 30 字</title>
<style>
  :root{
    --paper:#f7f3ea; --ink:#1f1b16; --muted:#7a7060; --line:#e0d6c4;
    --accent:#2f6b4f; --card:#fffdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:56px 24px 80px}
  header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:26px}
  h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:40px;letter-spacing:.05em;margin:0 0 10px;font-weight:600}
  .sub{color:var(--muted);font-size:14px;margin:0;line-height:1.75}
  .sub a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(47,107,79,.3)}
  .back{display:inline-block;margin-bottom:18px;font-size:13px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--accent)}
  .stats{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap}
  .stat b{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:600;display:block;line-height:1.2}
  .stat span{font-size:11.5px;color:var(--muted);letter-spacing:.08em}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 6px}
  input[type=search]{flex:1 1 240px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);font-size:15px;outline:none;color:var(--ink)}
  input[type=search]:focus{border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:transparent;
    font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .count{color:var(--muted);font-size:12.5px;margin:16px 0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
  a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:16px 16px 14px;text-decoration:none;color:inherit;
    transition:transform .12s, box-shadow .12s, border-color .12s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(40,60,45,.10);border-color:#bdd0c2}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a2957f;margin-bottom:9px}
  .cat{letter-spacing:.1em}
  .name{font-family:"Noto Serif TC","Songti TC",serif;font-size:28px;line-height:1.25;letter-spacing:.02em}
  .jyut{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;color:var(--accent);
    margin:7px 0 9px;min-height:16px}
  .sum{font-size:12.5px;line-height:1.65;color:var(--muted);margin:0;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.75}
  .empty{padding:44px 0;color:var(--muted);font-size:14px}
  @media(max-width:520px){h1{font-size:30px}.wrap{padding:36px 18px 60px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回 113 條主頁</a>
  <header>
    <h1>續篇：30 個識講唔識寫嘅字</h1>
    <p class="sub">主頁嗰 113 條全部出自<a href="https://www.ourchinastory.com/zh/tag/%E7%B2%B5%E8%AA%9E%E5%AD%97" target="_blank">《當代中國》粵語字標籤</a>；呢頁補返標籤冇收錄嘅日常字，每個字都有<a href="https://words.hk/" target="_blank">粵典 words.hk</a> 嘅詞典釋義，粵拼跟原文。</p>
    <div class="stats">
      <div class="stat"><b>30</b><span>條目</span></div>
      <div class="stat"><b>5</b><span>分類</span></div>
      <div class="stat"><b>粵典</b><span>逐字釋義</span></div>
    </div>
  </header>

  <div class="bar">
    <input id="q" type="search" placeholder="搵字、粵拼或意思…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <footer>粵拼同釋義抄自粵典（words.hk）對應條目，卡片右下「粵典」直接開原文。<br>「你問過嘅」兩條：輘輷 出自《當代中國》文章；吊吊揈 以粵典「揈」條目為據。</footer>
</div>
<script>
const DATA = [{"n": "撳", "j": "gam6", "s": "用手指向下施力；按", "c": "手部動作", "u": "https://words.hk/zidin/%E6%92%B3"}, {"n": "搣", "j": "mit1", "s": "用手指夾住，再用力扭", "c": "手部動作", "u": "https://words.hk/zidin/%E6%90%A3"}, {"n": "掟", "j": "deng3", "s": "投擲；從手中掉出", "c": "手部動作", "u": "https://words.hk/zidin/%E6%8E%9F"}, {"n": "揞", "j": "am2", "s": "用手遮住", "c": "手部動作", "u": "https://words.hk/zidin/%E6%8F%9E"}, {"n": "揈", "j": "fing6", "s": "冇目標咁拋、甩動", "c": "手部動作", "u": "https://words.hk/zidin/%E6%8F%88"}, {"n": "摷", "j": "caau3", "s": "伸手入底部再向外翻開", "c": "手部動作", "u": "https://words.hk/zidin/%E6%91%B7"}, {"n": "撻", "j": "daat3", "s": "大力向平面撞擊，發出悶響", "c": "手部動作", "u": "https://words.hk/zidin/%E6%92%BB"}, {"n": "摑", "j": "gwaat3", "s": "用手掌大力打面", "c": "手部動作", "u": "https://words.hk/zidin/%E6%91%91"}, {"n": "揼", "j": "dap6", "s": "握緊拳頭擊打", "c": "手部動作", "u": "https://words.hk/zidin/%E6%8F%BC"}, {"n": "嚡", "j": "haai4", "s": "表面唔平滑、粗糙", "c": "身體感覺", "u": "https://words.hk/zidin/%E5%9A%A1"}, {"n": "黐", "j": "ci1", "s": "黏貼；黏住", "c": "身體感覺", "u": "https://words.hk/zidin/%E9%BB%90"}, {"n": "焫", "j": "naat3", "s": "用熱物接觸、燙傷", "c": "身體感覺", "u": "https://words.hk/zidin/%E7%84%AB"}, {"n": "揦", "j": "laa2", "s": "刺痛、燒灼嘅感覺（揦脷）", "c": "身體感覺", "u": "https://words.hk/zidin/%E6%8F%A6"}, {"n": "𤓓", "j": "lo3", "s": "燒燶嘢嘅氣味；引申出醜", "c": "身體感覺", "u": "https://words.hk/zidin/%F0%A4%93%93"}, {"n": "攰", "j": "gui6", "s": "冇力、疲倦", "c": "身體感覺", "u": "https://words.hk/zidin/%E6%94%B0"}, {"n": "嘥", "j": "saai1", "s": "浪費（時間、錢、資源）", "c": "日常生活", "u": "https://words.hk/zidin/%E5%98%A5"}, {"n": "唞", "j": "tau2", "s": "休息；停低回氣", "c": "日常生活", "u": "https://words.hk/zidin/%E5%94%9E"}, {"n": "喐", "j": "juk1", "s": "動；移動", "c": "日常生活", "u": "https://words.hk/zidin/%E5%96%90"}, {"n": "嚿", "j": "gau6", "s": "塊（量詞，細件固體）", "c": "日常生活", "u": "https://words.hk/zidin/%E5%9A%BF"}, {"n": "冚", "j": "kam2", "s": "蓋住、覆蓋；「冚唪唥」＝全部", "c": "日常生活", "u": "https://words.hk/zidin/%E5%86%9A"}, {"n": "瞓", "j": "fan3", "s": "睡覺", "c": "日常生活", "u": "https://words.hk/zidin/%E7%9E%93"}, {"n": "諗", "j": "nam2", "s": "想、思考", "c": "日常生活", "u": "https://words.hk/zidin/%E8%AB%97"}, {"n": "屙", "j": "o1", "s": "排泄", "c": "日常生活", "u": "https://words.hk/zidin/%E5%B1%99"}, {"n": "罨", "j": "ap1", "s": "濕住焗住、唔通風", "c": "食物器物", "u": "https://words.hk/zidin/%E7%BD%A8"}, {"n": "焗", "j": "guk6", "s": "用熱鹽／沙慢火燜熟", "c": "食物器物", "u": "https://words.hk/zidin/%E7%84%97"}, {"n": "唧", "j": "zit1", "s": "用手指篤、戳", "c": "食物器物", "u": "https://words.hk/zidin/%E5%94%A7"}, {"n": "嘜", "j": "mak1", "s": "有耳嘅杯（借自 mug）", "c": "食物器物", "u": "https://words.hk/zidin/%E5%98%9C"}, {"n": "掗拃", "j": "aa6 zaa6", "s": "佔用太多空間、阻地方", "c": "食物器物", "u": "https://words.hk/zidin/%E6%8E%97%E6%8B%83"}, {"n": "輘輷", "j": "音近「景轟」", "s": "事情有內情、唔對路", "c": "你問過嘅", "u": "https://www.ourchinastory.com/zh/5808"}, {"n": "吊吊揈", "j": "diu4 diu2 fing6", "s": "懸空搖晃；引申吊兒郎當", "c": "你問過嘅", "u": "https://words.hk/zidin/%E6%8F%88"}];
const CATS = ["全部","你問過嘅","手部動作","身體感覺","日常生活","食物器物"];
let cat = "全部", q = "";
const chips = document.getElementById('chips');
CATS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === '全部' ? ' on' : '');
  b.textContent = c;
  b.onclick = () => {
    cat = c;
    [...chips.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render();
  };
  chips.appendChild(b);
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
function render() {
  const list = DATA.filter(d =>
    (cat === '全部' || d.c === cat) &&
    (!q || (d.n + ' ' + d.j + ' ' + d.s).toLowerCase().includes(q))
  );
  document.getElementById('count').textContent = `顯示 ${list.length} / ${DATA.length} 條`;
  document.getElementById('grid').innerHTML = list.map(d => `
    <a class="card" href="${d.u}" target="_blank" rel="noopener">
      <div class="top"><span class="cat">${d.c}</span><span>粵典 ↗</span></div>
      <div class="name">${d.n}</div>
      <div class="jyut">${d.j}</div>
      <p class="sum">${d.s}</p>
    </a>`).join('') || '<div class="empty">搵唔到，試下第個關鍵詞。</div>';
}
render();
</script>
</body>
</html>
